<title>Cabra contact sheet</title>
<style>
  body { margin: 0; background: #0b0f1a; color: #fff; font: 12px system-ui; }
  #grid { display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 4px; padding: 4px; }
